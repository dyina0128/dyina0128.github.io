<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>맞춤 혜택 V2 QA</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;background:#f5f8fb;color:#243447}main{max-width:760px;margin:auto;padding:22px 14px 50px}h1{color:#0879bd}.box{background:#fff;border:1px solid #dbe7ee;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}label,.title{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;box-sizing:border-box;min-height:50px;padding:10px;border:1px solid #bdcbd7;border-radius:9px;font-size:16px}.radios{display:flex;gap:8px;flex-wrap:wrap}.radios label{border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;font-weight:400}.radios input{width:auto;min-height:auto}.help{font-size:.86rem;color:#64748b}.error{color:#b91c1c;font-weight:700}.primary{width:100%;min-height:52px;border:0;border-radius:9px;background:#0879bd;color:#fff;font-weight:800;font-size:16px}.card{border:1px solid #dbe7ee;border-radius:12px;padding:14px;margin:10px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><h1>🎯 내 맞춤 혜택 찾기 <small>QA</small></h1><p>전국 시·군·구 + 보훈 여부 통합 테스트 화면입니다.</p><section class="box"><form id="qaForm"><div class="grid"><div><label for="region">거주 광역시·도</label><select id="region" name="region" required><option value="">선택</option><option>서울</option><option>부산</option><option>인천</option><option>경기</option><option>강원</option><option>대구</option><option>광주</option><option>대전</option><option>울산</option><option>세종</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option></select></div><div><label for="district">시·군·구</label><select id="district" name="district" disabled required><option value="">광역시·도를 먼저 선택</option></select></div><div><label>출생연도</label><input name="birthYear" type="number" min="1900" max="2026" placeholder="예: 1972" required></div><div><label>가구원 수</label><select name="household"><option>1</option><option selected>2</option><option>3</option><option>4</option><option value="5">5명 이상</option></select></div><div class="wide"><span class="title">국가유공자·보훈대상자 또는 유족에 해당하나요?</span><div class="radios"><label><input type="radio" name="veteranStatus" value="yes"> 예</label><label><input type="radio" name="veteranStatus" value="no" checked> 아니요</label><label><input type="radio" name="veteranStatus" value="unknown"> 잘 모르겠어요</label></div><p class="help">본인뿐 아니라 법령·공식 기준상 유족에 해당하는 경우도 포함해 선택합니다. 세부 자격은 공식기관에서 최종 확인합니다.</p></div><div><label>경제활동 상태</label><select name="status" required><option value="">선택</option><option value="employed">직장인</option><option value="jobseeker">구직 중·미취업</option><option value="business">자영업·사업자</option><option value="student">학생</option><option value="farmer">농어업 종사</option><option value="other">무직·기타</option></select></div><div><label>주거형태</label><select name="housing" required><option value="">선택</option><option value="jeonse">전세</option><option value="rent">월세</option><option value="owner">자가</option><option value="other">기타</option></select></div><div id="businessBox" class="wide" hidden><div class="box"><span class="title">소상공인에 해당하나요?</span><div class="radios"><label><input type="radio" name="smallBusiness" value="yes"> 예</label><label><input type="radio" name="smallBusiness" value="no"> 아니요</label><label><input type="radio" name="smallBusiness" value="unknown" checked> 잘 모르겠어요</label></div><div class="grid" style="margin-top:12px"><div><label>사업장 광역시·도</label><select name="businessRegion"><option value="">선택</option><option>서울</option><option>부산</option><option>인천</option><option>경기</option><option>강원</option><option>대구</option><option>광주</option><option>대전</option><option>울산</option><option>세종</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option></select></div><div><label>사업장 시·군·구</label><select name="businessDistrict" disabled><option value="">광역시·도를 먼저 선택</option></select></div></div></div></div></div><p id="err" class="error"></p><button class="primary" type="submit">내 혜택 결과 확인</button></form></section><section id="out" class="box" hidden><h2>테스트 결과</h2><p id="summary"></p><div id="cards"></div></section></main><script src="benefit-rules-v2.js"></script><script src="benefit-business-rules-v2.js"></script><script src="benefit-v2-qa.js"></script></body></html>

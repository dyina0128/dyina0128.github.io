name: Site quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE...$PR_HEAD" --
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              base="$(git hash-object -t tree /dev/null)"
            else
              base="$PUSH_BEFORE"
            fi
            git diff --check "$base" "$PUSH_AFTER" --
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate site structure and indexability
        run: node tools/check-site.mjs

      - name: Validate nationwide municipality coverage
        run: node tools/check-municipalities.mjs

      - name: Validate indexable exceptions and parent links
        run: node tools/check-indexing-exceptions.mjs

      - name: Validate personalized benefit matcher
        run: node tools/check-benefit-matcher.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check tools/check-site.mjs
          node --check tools/check-municipalities.mjs
          node --check tools/check-indexing-exceptions.mjs
          node --check tools/check-benefit-matcher.mjs
          node --check tools/prepare-adsense-review.mjs
          node --check benefit-rule-engine-v2.js
          node --check benefit-rules-v2.js
          node --check benefit-business-rules-v2.js
          node --check benefit-veteran-rules-v2.js
          node --check benefit-v2-integration.js
